name: Create Release
# Push a tag like 15-1.4.1 -> Release titled "1.4.1" with the APK attached
# (Xposed-Modules-Repo convention: tag = [versionCode]-[versionName]).
on:
  push:
    tags: ['**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#*-}"
          ASSET="apk/LineTamer-v${VER}.apk"
          test -f "$ASSET" || { echo "missing $ASSET"; exit 1; }
          gh release create "$TAG" \
            --title "${VER}" \
            --notes-file RELEASE_NOTES.md \
            "$ASSET"
